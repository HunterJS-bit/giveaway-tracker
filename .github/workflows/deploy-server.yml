name: Build, Test, and Deploy API Server

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Run tests
      #   run: npm test -- --runInBand

      - name: Build application
        run: npm run build --if-present

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/hunterjs-bit/giveaway-api:latest

      - name: Check Dokploy secrets
        if: success()
        run: |
          echo "DOKPLOY_URL is set: $([ -n "$DOKPLOY_URL" ] && echo "yes" || echo "no")"
          echo "DOKPLOY_API_KEY is set: $([ -n "$DOKPLOY_API_KEY" ] && echo "yes" || echo "no")"
          echo "DOKPLOY_APP_ID is set: $([ -n "$DOKPLOY_APP_ID" ] && echo "yes" || echo "no")"
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}

      - name: Update Environment Variables via Dokploy API
        run: |
          curl -X POST "${{ secrets.DOKPLOY_URL }}/api/application.update" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "applicationId": "${{ secrets.DOKPLOY_APP_ID }}",
              "env": "PORT=4001\nDATABASE_URL=${{ secrets.DATABASE_URL }}\nNODE_ENV=production"
            }'      

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          if [ -n "$DOKPLOY_URL" ] && [ -n "$DOKPLOY_API_KEY" ] && [ -n "$DOKPLOY_APP_ID" ]; then
            echo "Triggering deployment for application ID: $DOKPLOY_APP_ID"
            curl --fail --request POST \
              --url "$DOKPLOY_URL/api/application.deploy" \
              --header "x-api-key: $DOKPLOY_API_KEY" \
              --header "Content-Type: application/json" \
              --data "{\"applicationId\":\"$DOKPLOY_APP_ID\"}" || echo "Dokploy deployment trigger failed"
          else
            echo "Dokploy secrets not configured, skipping deployment trigger"
          fi
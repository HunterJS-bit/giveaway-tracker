name: Build, Test, and Deploy API Server

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    environment: prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Run tests
      #   run: npm test -- --runInBand

      - name: Build application
        run: npm run build --if-present

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/hunterjs-bit/giveaway-api:latest

      - name: Check Dokploy secrets
        if: success()
        run: |
          echo "DOKPLOY_URL is set: $([ -n "$DOKPLOY_URL" ] && echo "yes" || echo "no")"
          echo "DOKPLOY_API_KEY is set: $([ -n "$DOKPLOY_API_KEY" ] && echo "yes" || echo "no")"
          echo "DOKPLOY_APP_ID is set: $([ -n "$DOKPLOY_APP_ID" ] && echo "yes" || echo "no")"
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}

      - name: Update Environment Variables via Dokploy API
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          PAYLOAD_FILE="$RUNNER_TEMP/dokploy-payload.json"
          RESPONSE_FILE="$RUNNER_TEMP/dokploy-response.txt"

          # Build the JSON payload with python for safe escaping of secret
          # values (quotes, slashes, etc.). The JSON goes to a file so that
          # nothing else can pollute the request body.
          python3 - <<'EOF' > "$PAYLOAD_FILE"
          import json
          import os
          import sys

          env_lines = [
              "PORT=4001",
              f"DATABASE_URL={os.environ['DATABASE_URL']}",
              "NODE_ENV=production",
              "FRONTEND_URL=https://svenagradneigre.rs,http://localhost:3001",
          ]

          def add(name, value):
              if value:
                  env_lines.append(f"{name}={value}")

          # Auth
          add("JWT_SECRET", os.environ.get("JWT_SECRET"))
          add("GOOGLE_CLIENT_ID", os.environ.get("GOOGLE_CLIENT_ID"))

          # Public base URL for locally uploaded images (absolute URLs)
          add("PUBLIC_URL", os.environ.get("API_BASE_URL"))

          # Cloudflare R2 — when all five are set, image uploads go to R2;
          # otherwise the API falls back to local ./uploads storage.
          r2_names = (
              "R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY",
              "R2_BUCKET_NAME", "R2_PUBLIC_URL",
          )
          r2_values = [os.environ.get(name, "") for name in r2_names]
          if all(r2_values):
              for name, value in zip(r2_names, r2_values):
                  env_lines.append(f"{name}={value}")

          payload = {
              "applicationId": os.environ["DOKPLOY_APP_ID"],
              "env": "\n".join(env_lines),
          }
          json.dump(payload, sys.stdout)

          # Diagnostics on stderr: variable NAMES only, never values
          print("Setting env keys: " + ", ".join(l.split("=", 1)[0] for l in env_lines), file=sys.stderr)
          EOF

          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET_NAME" ] && [ -n "$R2_PUBLIC_URL" ]; then
            echo "::notice::R2 fully configured - image uploads will go to Cloudflare R2"
          else
            echo "::warning::R2 secrets not fully set - image uploads will use local ./uploads storage"
          fi

          echo "Updating environment variables in Dokploy..."
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "$DOKPLOY_URL/api/application.update" \
            -H "accept: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @"$PAYLOAD_FILE")

          echo "Dokploy responded with HTTP $HTTP_CODE"

          case "$HTTP_CODE" in
            2*)
              echo "Environment variables updated."
              ;;
            *)
              echo "::error::Failed to update environment variables (HTTP $HTTP_CODE)"
              echo "--- Dokploy response ---"
              cat "$RESPONSE_FILE" 2>/dev/null || true
              echo
              exit 1
              ;;
          esac

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          if [ -n "$DOKPLOY_URL" ] && [ -n "$DOKPLOY_API_KEY" ] && [ -n "$DOKPLOY_APP_ID" ]; then
            echo "Triggering deployment for application ID: $DOKPLOY_APP_ID"
            HTTP_CODE=$(curl -sS -o "$RUNNER_TEMP/deploy-response.txt" -w "%{http_code}" \
              --request POST \
              --url "$DOKPLOY_URL/api/application.deploy" \
              --header "x-api-key: $DOKPLOY_API_KEY" \
              --header "Content-Type: application/json" \
              --data "{\"applicationId\":\"$DOKPLOY_APP_ID\"}")

            echo "Deploy trigger responded with HTTP $HTTP_CODE"

            case "$HTTP_CODE" in
              2*)
                echo "Deployment triggered."
                ;;
              *)
                echo "::error::Failed to trigger deployment (HTTP $HTTP_CODE)"
                echo "--- Dokploy response ---"
                cat "$RUNNER_TEMP/deploy-response.txt" 2>/dev/null || true
                echo
                exit 1
                ;;
            esac
          else
            echo "Error: DOKPLOY_URL, DOKPLOY_API_KEY, or DOKPLOY_APP_ID not configured"
            exit 1
          fi

      - name: Wait for deployment and health check
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "API_BASE_URL is: '${API_BASE_URL}'"
          
          if [ -z "$API_BASE_URL" ]; then
            echo "❌ Error: API_BASE_URL is not set or empty"
            echo "Please add API_BASE_URL variable in GitHub Actions settings"
            exit 1
          fi

          echo "Waiting for deployment to complete..."
          sleep 30

          echo "Starting health check..."
          MAX_RETRIES=10
          RETRY_COUNT=0
          HEALTH_URL="${API_BASE_URL}/api/health"
          echo "Health check URL: $HEALTH_URL"

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
            
            RESPONSE=$(curl -s -w "\n%{http_code}" "$HEALTH_URL" 2>/dev/null)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed!"
              echo "Response: $BODY"
              exit 0
            else
              echo "❌ Health check failed (HTTP $HTTP_CODE)"
              echo "Response: $BODY"
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1
name: Build, Test, and Deploy API Server

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    environment: prod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # - name: Run tests
      #   run: npm test -- --runInBand

      - name: Build application
        run: npm run build --if-present

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/hunterjs-bit/giveaway-api:latest

      - name: Check Dokploy secrets
        if: success()
        run: |
          echo "DOKPLOY_URL is set: $([ -n "$DOKPLOY_URL" ] && echo "yes" || echo "no")"
          echo "DOKPLOY_API_KEY is set: $([ -n "$DOKPLOY_API_KEY" ] && echo "yes" || echo "no")"
          echo "DOKPLOY_APP_ID is set: $([ -n "$DOKPLOY_APP_ID" ] && echo "yes" || echo "no")"
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}

      - name: Update Environment Variables via Dokploy API
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: |
          ENV_JSON=$(python3 - <<'EOF'
          import json
          import os

          env_lines = [
              "PORT=4001",
              f"DATABASE_URL={os.environ['DATABASE_URL']}",
              "NODE_ENV=production",
              "FRONTEND_URL=https://svenagradneigre.rs,http://localhost:3001",
          ]

          def add(name, value):
              if value:
                  env_lines.append(f"{name}={value}")

          # Auth
          add("JWT_SECRET", os.environ.get("JWT_SECRET"))
          add("GOOGLE_CLIENT_ID", os.environ.get("GOOGLE_CLIENT_ID"))

          # Public base URL for locally uploaded images (absolute URLs)
          add("PUBLIC_URL", os.environ.get("API_BASE_URL"))

          # Cloudflare R2 — when all five are set, image uploads go to R2;
          # otherwise the API falls back to local ./uploads storage.
          r2 = [os.environ.get(v) for v in (
              "R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY",
              "R2_BUCKET_NAME", "R2_PUBLIC_URL",
          )]
          if all(r2):
              for name, value in zip(
                  ("R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY",
                   "R2_BUCKET_NAME", "R2_PUBLIC_URL"), r2
              ):
                  env_lines.append(f"{name}={value}")
              print("::notice::R2 fully configured - uploads will go to Cloudflare R2")
          else:
              print("::warning::R2 secrets not fully set - image uploads will use local ./uploads storage")

          payload = {
              "applicationId": os.environ["DOKPLOY_APP_ID"],
              "env": "\n".join(env_lines) + "\n",
          }
          print(json.dumps(payload))
          EOF
          )

          echo "Updating environment variables (values hidden)..."
          echo "Payload: $ENV_JSON"
          curl --fail -X POST "$DOKPLOY_URL/api/application/update" \
            -H "accept: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$ENV_JSON"

      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          if [ -n "$DOKPLOY_URL" ] && [ -n "$DOKPLOY_API_KEY" ] && [ -n "$DOKPLOY_APP_ID" ]; then
            echo "Triggering deployment for application ID: $DOKPLOY_APP_ID"
            curl --fail --request POST \
              --url "$DOKPLOY_URL/api/application/deploy" \
              --header "x-api-key: $DOKPLOY_API_KEY" \
              --header "Content-Type: application/json" \
              --data "{\"applicationId\":\"$DOKPLOY_APP_ID\"}"
          else
            echo "Error: DOKPLOY_URL, DOKPLOY_API_KEY, or DOKPLOY_APP_ID not configured"
            exit 1
          fi

      - name: Wait for deployment and health check
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          echo "API_BASE_URL is: '${API_BASE_URL}'"
          
          if [ -z "$API_BASE_URL" ]; then
            echo "❌ Error: API_BASE_URL is not set or empty"
            echo "Please add API_BASE_URL variable in GitHub Actions settings"
            exit 1
          fi

          echo "Waiting for deployment to complete..."
          sleep 30

          echo "Starting health check..."
          MAX_RETRIES=10
          RETRY_COUNT=0
          HEALTH_URL="${API_BASE_URL}/api/health"
          echo "Health check URL: $HEALTH_URL"

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
            
            RESPONSE=$(curl -s -w "\n%{http_code}" "$HEALTH_URL" 2>/dev/null)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | head -n-1)

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed!"
              echo "Response: $BODY"
              exit 0
            else
              echo "❌ Health check failed (HTTP $HTTP_CODE)"
              echo "Response: $BODY"
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1
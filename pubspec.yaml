name: balkan_giveaway_tracker
description: Balkan Giveaway Tracker – Find & track giveaways in Serbia, Croatia, and Bosnia.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Local Storage
  shared_preferences: ^2.3.2

  # Push Notifications (local)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Networking (ready for backend)
  http: ^1.2.2

  # Image caching
  cached_network_image: ^3.4.1

  # Date formatting / countdown
  intl: ^0.20.2

  # UI Extras
  flutter_svg: ^2.0.10+1

  cupertino_icons: ^1.0.8
  share_plus: ^12.0.1
  url_launcher: ^6.3.1
  sqflite: ^2.4.2
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icons/
    - assets/images/
